<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codexianb</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 { text-align: center; font-size: 20px; color: #4ade80; }
  .videos {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  video {
    width: 360px;
    max-width: 45vw;
    background: #000;
    border-radius: 8px;
    border: 2px solid #333;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  #startBtn { background: #4ade80; }
  #nextBtn { background: #60a5fa; }
  #stopBtn { background: #f87171; }
  #status { text-align: center; color: #999; margin-bottom: 10px; }

  .chatBox {
    max-width: 600px;
    margin: 0 auto;
    background: #1a1a1a;
    border-radius: 8px;
    padding: 12px;
  }
  #messages {
    height: 180px;
    overflow-y: auto;
    padding: 8px;
    background: #000;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #messages div { margin-bottom: 4px; }
  .me { color: #4ade80; }
  .them { color: #60a5fa; }
  .sys { color: #999; font-style: italic; }
  .chatInput { display: flex; gap: 8px; }
  .chatInput input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #111;
    color: #eee;
  }
</style>
</head>
<body>

<h1>🌐 Codexianb</h1>
<p id="status">Not connected</p>

<div class="videos">
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="nextBtn" disabled>Next Stranger</button>
  <button id="stopBtn" disabled>Stop</button>
</div>

<div class="chatBox">
  <div id="messages"></div>
  <div class="chatInput">
    <input id="chatInput" placeholder="Type a message..." disabled />
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<!-- Socket.io client, served automatically by the socket.io server -->
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const messagesEl = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

let localStream = null;
let peerConnection = null;
let currentPeerId = null;

// --- IMPORTANT ---
// Add your own TURN server credentials here for production use.
// Public STUN alone will fail for a meaningful % of real-world users
// behind strict NATs / corporate firewalls.
const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' }
    // { urls: 'turn:your-turn-server.com:3478', username: 'user', credential: 'pass' }
  ]
};

function logMsg(text, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function initMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;
}

function createPeerConnection(peerId) {
  const pc = new RTCPeerConnection(rtcConfig);

  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('ice-candidate', { target: peerId, candidate: event.candidate });
    }
  };

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  pc.onconnectionstatechange = () => {
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
      statusEl.textContent = 'Connection lost. Click "Next Stranger" to reconnect.';
    }
  };

  return pc;
}

async function startAsInitiator(peerId) {
  peerConnection = createPeerConnection(peerId);
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('offer', { target: peerId, offer });
}

// --- Socket events ---

socket.on('matched', async ({ peerId, initiator }) => {
  currentPeerId = peerId;
  statusEl.textContent = 'Connected to a stranger!';
  logMsg('You are now chatting with a stranger.', 'sys');
  nextBtn.disabled = false;
  stopBtn.disabled = false;
  chatInput.disabled = false;
  sendBtn.disabled = false;

  if (initiator) {
    await startAsInitiator(peerId);
  } else {
    peerConnection = createPeerConnection(peerId);
  }
});

socket.on('offer', async ({ from, offer }) => {
  if (!peerConnection) peerConnection = createPeerConnection(from);
  await peerConnection.setRemoteDescription(offer);
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit('answer', { target: from, answer });
});

socket.on('answer', async ({ answer }) => {
  await peerConnection.setRemoteDescription(answer);
});

socket.on('ice-candidate', async ({ candidate }) => {
  try {
    await peerConnection.addIceCandidate(candidate);
  } catch (err) {
    console.error('Error adding ICE candidate', err);
  }
});

socket.on('chat-message', ({ text }) => {
  logMsg('Stranger: ' + text, 'them');
});

socket.on('partner-left', () => {
  logMsg('Stranger has disconnected.', 'sys');
  statusEl.textContent = 'Stranger left. Click "Next Stranger" to find someone new.';
  cleanupConnection();
});

// --- UI actions ---

function cleanupConnection() {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  remoteVideo.srcObject = null;
  currentPeerId = null;
}

startBtn.addEventListener('click', async () => {
  await initMedia();
  statusEl.textContent = 'Looking for a stranger...';
  socket.emit('find-peer');
  startBtn.disabled = true;
  nextBtn.disabled = false;
  stopBtn.disabled = false;
});

nextBtn.addEventListener('click', () => {
  cleanupConnection();
  messagesEl.innerHTML = '';
  statusEl.textContent = 'Looking for a new stranger...';
  socket.emit('find-peer');
});

stopBtn.addEventListener('click', () => {
  socket.emit('leave');
  cleanupConnection();
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
    localStream = null;
  }
  localVideo.srcObject = null;
  statusEl.textContent = 'Stopped.';
  startBtn.disabled = false;
  nextBtn.disabled = true;
  stopBtn.disabled = true;
  chatInput.disabled = true;
  sendBtn.disabled = true;
  messagesEl.innerHTML = '';
});

sendBtn.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !currentPeerId) return;
  socket.emit('chat-message', { target: currentPeerId, text });
  logMsg('You: ' + text, 'me');
  chatInput.value = '';
}
</script>
</body>
</html>
